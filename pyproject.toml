[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bayesmith"
version = "0.3.0"
description = "A graph of operators is a Bayesian model; its structure chooses the inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zheng Zhang" }]
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.5",
    "equinox>=0.13",
    "numpy",
    # numpyro is the last row of the dispatch table, not an optional extra:
    # every graph that qualifies for an exact method must also be runnable
    # through NUTS, because that is what the exact paths are verified against.
    "numpyro>=0.15",
]

[project.urls]
Repository = "https://github.com/zzhang0123/bayesmith"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-xdist",
    "hypothesis",
    "ruff",
]
# The cross-check harness, and the only place rheplicant is ever named. It is a
# LOCAL PATH dependency, it is not in the wheel, and it is not in `dev` -- so a
# clone that has no e-RHINO checkout installs and tests normally, with the
# cross-checks skipping and saying why.
#
# Install it WITHOUT its dependencies:
#
#     uv pip install --python .venv/bin/python --no-deps -e ../e-RHINO
#
# Measured, and the reason `--no-deps` is not a shortcut: rheplicant's declared
# dependencies include limTOD, which drags roughly seventy-eight transitive
# packages in and would resolve jax/numpy against a second set of constraints.
# `rheplicant`, `rheplicant.inference` and even `rheplicant.config` all import
# with limTOD and PyYAML absent -- the sky engines import limTOD lazily -- so
# the layer these cross-checks compare needs only jax, equinox and numpy, all
# of which this venv already has. Measured before and after: 26 packages became
# 27, and this suite went 637 passed -> 637 passed.
#
# The path is written relative to nothing here on purpose: it differs per
# machine, so it is an install-time argument rather than a pinned string.
#
# The P5 sensitivity cross-check additionally needs rheplicant's tour twin,
# which imports rhino-cal-jax -- another local editable, same recipe, plus
# `editables` (its editable hook's runtime, which uv does not install with
# --no-deps; measured: the .pth hook fails on import without it and the
# package silently is not on the path):
#
#     uv pip install --python .venv/bin/python --no-deps -e ../rhino-cal
#     uv pip install --python .venv/bin/python editables
#
# Without it that one fixture skips loudly and says so; the identifiability
# and Jeffreys cross-checks need only rheplicant.
crosscheck = []

[tool.hatch.build.targets.sdist]
# What a user or a distro packager needs to rebuild and verify this package,
# and nothing else. `docs/` here is internal working material -- plans, specs,
# handoff notes, probe scripts, cross-check records -- not user documentation,
# and 16 of those files carry absolute paths under a developer's home
# directory. An sdist is published permanently and is indexed; excluding them
# is reversible in a way that uploading them is not.
include = [
    "src",
    "tests",
    # The cross-check record pages, because `tests/test_migration_records.py`
    # ships and asserts against them: an sdist whose own test suite cannot
    # pass is a worse artefact than one that omits the tests. Checked clean of
    # absolute paths, unlike `docs/superpowers/` and `docs/probes/`.
    "docs/migration",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
# Two REPOSITORY-governance tests, not package tests: they parse the internal
# migration spec and assert that planning documents agree with each other.
# Shipping them is what would force shipping `docs/superpowers/`, and an sdist
# whose suite fails out of the box is worse than one that omits four checks
# nobody outside this repository can act on. Measured: with these two out and
# `docs/migration` in, a clean-venv install of the sdist runs its own suite
# green.
exclude = [
    "tests/test_migration_records.py",
    "tests/crosscheck/test_spec_claims.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bayesmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that take more than a few seconds",
    "x64: requires JAX_ENABLE_X64=1 (run as a separate session)",
    "crosscheck: compares this package against rheplicant, which must be installed",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# RUF022 wants `__all__` sorted alphabetically. Both `__all__` declarations in
# this package are grouped by narrative instead -- tracing, graph, evaluation,
# inference, exact, errors -- matching the order each module's own docstring
# introduces them, which is what a reader following that docstring needs. An
# alphabetical list would interleave `check_gaussian` with `condition_bound`
# and `GLSResult` with `LinearBlock`, losing that structure for no gain: these
# lists are read, not searched. Decided once here rather than as two `noqa`s.
ignore = ["RUF022"]

[tool.coverage.run]
source = ["bayesmith"]
