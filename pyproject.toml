[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bayesmith"
version = "0.0.0"
description = "A graph of operators is a Bayesian model; its structure chooses the inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zheng Zhang" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.5",
    "equinox>=0.13",
    "numpy",
    # numpyro is the last row of the dispatch table, not an optional extra:
    # every graph that qualifies for an exact method must also be runnable
    # through NUTS, because that is what the exact paths are verified against.
    "numpyro>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-xdist",
    "hypothesis",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bayesmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests that take more than a few seconds",
    "x64: requires JAX_ENABLE_X64=1 (run as a separate session)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.coverage.run]
source = ["bayesmith"]
