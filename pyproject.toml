[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bayesmith"
version = "0.8.0"
description = "A graph of operators is a Bayesian model; its structure chooses the inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zheng Zhang" }]
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.5",
    "equinox>=0.13",
    "numpy",
    # numpyro is the last row of the dispatch table, not an optional extra:
    # every graph that qualifies for an exact method must also be runnable
    # through NUTS, because that is what the exact paths are verified against.
    "numpyro>=0.15",
]

# The first extras this package has ever declared (R5 Task 4). They carry the
# nested sampler that runs a RESIDUAL evidence integral -- the part of
# `log p(d)` that does not collapse in closed form. `pip install bayesmith`
# pulls neither, the suite is green with both absent, and that absence is what
# CI's fast layer runs: with no sampler an `EvidenceTask` over an admitted
# residual graph returns a `Refusal` naming these extras and the command above,
# and every other task on the same graph is unaffected.
#
# TWO extras and no default, on purpose. R5's bake-off (Task 5) has not run and
# its legal answers include "no candidate passed", so a single
# `residual-evidence` extra pointing at one of these would be that decision
# taken by packaging rather than by measurement. Whichever wins, the loser's
# extra is removed rather than left as a trap.
#
# Measured in throwaway copies of this repository's environment on 2026-09-05,
# against the jax it already had (0.11.1) -- see
# `docs/probes/probe_36_backend_survey.py`, which re-runs all of it:
#
#   blackjax 1.6.2  adds 3 packages, declares `jax>=0.9.0`, jax unmoved
#   jaxns 2.6.9     adds 16 packages, declares `jax>=0.6.0`, jax unmoved
#
# and both coexist in one environment (18 packages added, jax still 0.11.1).
#
# `jaxns` carries one cost this table cannot express and the survey records:
# importing it writes `jax.config.update('jax_enable_x64', True)`
# process-globally, which is the opposite of this package's rule that `src/`
# never touches `jax.config`. INSTALLING it does not import it -- nothing here
# does -- so R4's precision gate is untouched by the install: measured, the two
# tests a global x64 flip reddens both pass with either candidate installed and
# with both, while the same two go red under `JAX_ENABLE_X64=1`. The capability
# probe in `dispatch/task.py` reads the installed metadata and never reaches a
# module body, which is what keeps that true.
#
# An earlier version of this comment said "the suite is green with it
# installed". That was false and an adversarial review measured it: installing
# `blackjax` turned `tests/dispatch/test_backend_absent.py` red, because those
# tests took their "the extra is absent" baseline from whatever the checkout
# happened to have. The defect was the tests' and is repaired; the sentence is
# narrowed to the claim that was actually measured.
[project.optional-dependencies]
blackjax = ["blackjax>=1.6"]
jaxns = ["jaxns>=2.6"]

[project.urls]
Repository = "https://github.com/zzhang0123/bayesmith"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-xdist",
    "hypothesis",
    "ruff",
    # Optional ArviZ export seam (R2 Task 6), dev-only: the package never
    # imports it at runtime, but tests/bridge/test_arviz_export.py needs it to
    # RUN rather than importorskip. Kept out of [project].dependencies for the
    # same reason rheplicant stays out of dev -- a test-only weight no runtime
    # consumer should pay.
    # BOTH PINNED, and the second pin is why the first one is a pin at all.
    # `se` on a LOO report is arviz-stats's number, and 1.3.2 changed it by
    # `sqrt(n / (n - 1))` -- a ddof 0->1 change. Commit `a5ab3a3` passed the
    # 2026-09-05 nightly and failed the 2026-09-06 one with the repository
    # byte-identical, because 1.3.2 was uploaded between the two runs and this
    # group resolves fresh on every CI run.
    #
    # Pinning `arviz` alone would not have caught it: `arviz==1.3.0` requires
    # `arviz_stats>=1.3.0,<1.4.0`, which 1.3.2 satisfies. So the component that
    # produces the constant is pinned. But pinning only that component freezes
    # the umbrella anyway and says nothing -- measured, `uv pip install "arviz"
    # "arviz-stats==1.2.0"` backtracks arviz to 1.2.0 with no error and no
    # warning. `arviz` is pinned beside it so the ceiling is a declaration
    # rather than a side effect.
    #
    # The cost, stated because it is real: two tests in
    # tests/evaluation/test_loo.py exist to notice upstream MOVEMENT --
    # `test_the_upstream_still_has_no_top_level_waic` and
    # `test_a_flat_export_is_what_arviz_refuses` -- and while these pins hold
    # both pass without being able to see a newer arviz. Raising the pins is
    # what re-arms them, and raising them means re-measuring the two `se`
    # constants in the same commit.
    #
    # `test_the_pinned_arviz_stats_is_what_the_se_constants_were_measured_against`
    # is the run that binds this pin to those constants. Before it existed,
    # deleting this line left 81 tests passing and nothing noticed -- which is
    # this repository's most-repaired defect, two files and a hope.
    #
    # The marker is not decoration. `requires-python` here is `>=3.11` and both
    # of these need `>=3.12`, so an unmarked pin makes the project's
    # requirements unsatisfiable on 3.11 -- measured: it left the suite jobs
    # green, because `uv pip install` resolves for the active interpreter only,
    # and turned crosscheck.yml red, because `uv run` resolves across the whole
    # declared range. On 3.11 the dev group therefore carries no arviz at all
    # and the `requires_arviz` tests skip, which is the honest outcome: the
    # newest arviz supporting 3.11 is 0.23.4, a different major line whose
    # output these constants were never measured against.
    "arviz==1.3.0; python_version >= '3.12'",
    "arviz-stats==1.3.2; python_version >= '3.12'",
]
# The cross-check harness, and the only place rheplicant is ever named. It is a
# LOCAL PATH dependency, it is not in the wheel, and it is not in `dev` -- so a
# clone that has no rheplicant checkout installs and tests normally, with the
# cross-checks skipping and saying why.
#
# Install it WITHOUT its dependencies:
#
#     uv pip install --python .venv/bin/python --no-deps -e ../rheplicant
#
# Measured, and the reason `--no-deps` is not a shortcut: rheplicant's declared
# dependencies include limTOD, which drags roughly seventy-eight transitive
# packages in and would resolve jax/numpy against a second set of constraints.
# `rheplicant`, `rheplicant.inference` and even `rheplicant.config` all import
# with limTOD and PyYAML absent -- the sky engines import limTOD lazily -- so
# the layer these cross-checks compare needs only jax, equinox and numpy, all
# of which this venv already has. Measured before and after: 26 packages became
# 27, and this suite went 637 passed -> 637 passed.
#
# The path is written relative to nothing here on purpose: it differs per
# machine, so it is an install-time argument rather than a pinned string.
#
# The P5 sensitivity cross-check additionally needs rheplicant's tour twin,
# which imports rhino-cal-jax -- another local editable, same recipe, plus
# `editables` (its editable hook's runtime, which uv does not install with
# --no-deps; measured: the .pth hook fails on import without it and the
# package silently is not on the path):
#
#     uv pip install --python .venv/bin/python --no-deps -e ../rhino-cal
#     uv pip install --python .venv/bin/python editables
#
# Without it that one fixture skips loudly and says so; the identifiability
# and Jeffreys cross-checks need only rheplicant.
crosscheck = []

[tool.hatch.build.targets.sdist]
# What a user or a distro packager needs to rebuild and verify this package,
# and nothing else. `docs/` here is internal working material -- plans, specs,
# handoff notes, probe scripts, cross-check records -- not user documentation,
# and 16 of those files carry absolute paths under a developer's home
# directory. An sdist is published permanently and is indexed; excluding them
# is reversible in a way that uploading them is not.
include = [
    "src",
    "tests",
    # The cross-check record pages, because `tests/test_migration_records.py`
    # ships and asserts against them: an sdist whose own test suite cannot
    # pass is a worse artefact than one that omits the tests. Checked clean of
    # absolute paths, unlike `docs/superpowers/` and `docs/probes/`.
    "docs/migration",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
# Two REPOSITORY-governance tests, not package tests: they parse the internal
# migration spec and assert that planning documents agree with each other.
# Shipping them is what would force shipping `docs/superpowers/`, and an sdist
# whose suite fails out of the box is worse than one that omits four checks
# nobody outside this repository can act on. Measured: with these two out and
# `docs/migration` in, a clean-venv install of the sdist runs its own suite
# green.
exclude = [
    "tests/test_migration_records.py",
    "tests/crosscheck/test_spec_claims.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bayesmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "full: heavy numerical-gate boundary and mutation grids; run in the nightly layer, excluded from the fast layer",
    "slow: tests that take more than a few seconds",
    "x64: requires JAX_ENABLE_X64=1 (run as a separate session)",
    "crosscheck: compares this package against rheplicant, which must be installed",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# RUF022 wants `__all__` sorted alphabetically. Both `__all__` declarations in
# this package are grouped by narrative instead -- tracing, graph, evaluation,
# inference, exact, errors -- matching the order each module's own docstring
# introduces them, which is what a reader following that docstring needs. An
# alphabetical list would interleave `check_gaussian` with `condition_bound`
# and `GLSResult` with `LinearBlock`, losing that structure for no gain: these
# lists are read, not searched. Decided once here rather than as two `noqa`s.
ignore = ["RUF022"]

[tool.coverage.run]
source = ["bayesmith"]
