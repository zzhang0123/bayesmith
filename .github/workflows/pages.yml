# Local candidate documentation is not deployed on push.
# Explicit manual opt-in is required for any future Pages publication.
name: Pages

on:
  workflow_dispatch:
    inputs:
      publish_docs:
        description: "Publish the unindexed documentation candidate to Pages"
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ inputs.publish_docs }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate generated documentation before publishing
        run: |
          python tools/build_docs.py --check
          python tools/build_docs.py --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
