# Publishes site/ -- the package overview page -- to GitHub Pages through the
# Actions deployment path, so there is no gh-pages branch to keep in step with
# main. It runs only when the page or this file changes, and on demand.
#
# One-time setting this file cannot make for itself: Pages has to be switched
# on in the repository settings with "GitHub Actions" as the source. Until that
# is done the deploy step fails and says so; nothing else in the repository
# depends on this workflow.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
