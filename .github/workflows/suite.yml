# Run this package's own test suite on Linux.
#
# WHY THIS FILE EXISTS, measured: until 2026-09-02 the suite had never run on
# anything but one macOS arm64 laptop, and the ONLY place it met Linux was the
# publish job -- after the tag was pushed and therefore after the version
# number was spent. Four tags died there. v0.7.0 died with 16 failures and
# 2091 errors on ubuntu while the same wheel passed 5375/5375 on the laptop,
# and the largest single cause was one assertion: a fixture requiring a C-order
# and an F-order matmul of the same factors to differ in their last bit, which
# is true under Apple's Accelerate (one ULP) and false under OpenBLAS.
#
# A tag is immutable, so "the suite is green" has to be answerable BEFORE one
# is pushed, on the platform the release is built on. That is this workflow.
# It is not a substitute for the publish job's wheel test; it is the thing that
# has to be green first, so that the wheel test is a confirmation rather than a
# discovery.
#
# TWO JOBS ON PURPOSE, because they fail differently:
#
#   source -- the working tree with the dev group, which is what a developer
#             runs. arviz is present, so the seven ArviZ export tests actually
#             EXECUTE here; in the wheel job they skip.
#   wheel  -- byte-for-byte what publish.yml does, so a packaging fault (a
#             module the wheel excludes) surfaces here rather than at a tag.
#
# `fail-fast: false` is deliberate: when both are red the two logs answer
# different questions, and cancelling one to save a runner minute throws away
# half the evidence.
#
# LAYER, and why it is chosen by event rather than by an input: `-m "not full"`
# is this repository's pre-commit habit and the whole suite is the nightly
# layer (CLAUDE.md). A pull request gets the fast layer so review stays quick;
# main, the nightly schedule and a manual run get everything, because that is
# the claim a release rests on. There are no `workflow_dispatch` inputs at all,
# which is the cheapest way to have no injection surface.
#
# ON INJECTION SAFETY. This workflow interpolates nothing into a `run:` block.
# The one piece of context it consumes, `github.event_name`, is a GitHub-set
# enum rather than attacker-controllable text, and it is still passed through
# `env:` and expanded by the shell rather than substituted by the expression
# engine -- because the rule that survives review is "never in a run block",
# not "never unless I judged this one safe". It reads no titles, bodies,
# comments, branch names or commit messages.
#
# `-q` IS NOT ADDED ANYWHERE. `pyproject.toml` already carries `addopts = -q`,
# and a second one makes it `-qq`, which deletes the summary line entirely.
# Counts come from the JUnit XML and the verdict from the exit code, which is
# also why each pytest step writes XML and the floor step parses it.

# WHY `-n 2 --dist loadgroup` AND NOT `-n 4`, measured 2026-09-20. This
# workflow failed nine nights running, 2026-09-12 to 2026-09-20, and not one
# of those runs reached a summary line: each was killed mid-suite with exit
# 143 under "The hosted runner lost communication with the server ... starves
# it for CPU/Memory". Nothing was wrong with the tests. Progress DECELERATED
# rather than stopped -- run 34682061310 went 48% -> 69% in eleven seconds and
# 69% -> 74% in fourteen minutes -- and that curve is swap. A slow test is
# slow at a constant rate; only a resource shortage accelerates.
#
# The examples are run in a child interpreter, one per test, and peak RSS of a
# single child measured on that checkout was 4765 MB for composed_process,
# 928 MB for validate_sampling, then 817, 768, 585, 520, 517 MB. Under xdist's
# default `--dist load` four workers can each reach one at once, and four
# children alone come to 7278 MB before counting the workers that spawned them
# or the 151 MB every worker pays to import jax and numpyro. That is more than
# this runner has. It is arithmetic, not an unlucky interleaving, which is why
# it reproduced every night rather than intermittently.
#
# tests/conftest.py puts those modules in one xdist group and `--dist
# loadgroup` sends a group to a single worker, so at most one child exists at
# a time; `-n 2` then keeps the resident workers inside the budget too. The
# demos themselves are NOT reduced -- their budgets are registered settings
# and the tests assert on what they recover, so trimming draws would buy green
# by weakening the claim.
#
# `-n 2` IS A FLOOR CHOSEN WITHOUT THE NUMBER IT SHOULD BE CHOSEN FROM. No log
# in this repository has ever stated the runner's cores or memory; 2 and 7 GiB
# are what a private repository is documented to get, not something measured
# here. The capacity lines below fix that, and once a few runs have printed
# them this is worth revisiting -- on a 4-core runner `-n 4` with loadgroup
# would be back in budget and half the wall clock.
#
# THE TIMEOUTS ARE FOR EVIDENCE, not for speed. A killed runner uploads
# nothing, so nine consecutive red nights produced not one JUnit XML and the
# `F`s in the logs were never explained by a summary. `timeout-minutes` on the
# pytest STEP fails that step while leaving the `if: always()` reporting and
# upload steps to run, so a future overrun leaves the artifact behind it. The
# job-level timeout is only a backstop against the six-hour default, which at
# two jobs a night is also a bill.

name: Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 03:17 UTC, an odd minute rather than the top of the hour: GitHub queues
    # scheduled jobs and the hour boundary is where every repository piles up.
    #
    # WEEKLY, NOT NIGHTLY, and the reason is a bill rather than a preference.
    # Billing is PER JOB, so one run costs the sum of both: measured on
    # 2026-09-20, 88 min for source and 70 for wheel, 158 job-minutes. Nightly
    # that is ~4,740 minutes a month, which is past the allowance on its own,
    # and the nine runs this cadence produced between 2026-09-12 and 09-20 cost
    # MORE than a healthy one -- up to 317 job-minutes -- because a starved job
    # hung for hours before it died, and returned nothing at all.
    #
    # Monday 03:17 UTC is ~1,106 minutes a month for the same coverage. What it
    # costs is latency: a regression that a dependency move introduces on a
    # Tuesday is now found on the following Monday rather than the next
    # morning. That is the trade, stated so the next reader can undo it
    # knowingly -- put the `*` back and the bill returns with it.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

# A superseded run is a run nobody will read. Pushing twice inside an hour used
# to leave the first push's two jobs running to completion and billing for it;
# this cancels them. The schedule and a manual dispatch get their own groups by
# ref, so a nightly is never cancelled by a push to the same branch mid-run --
# only by a newer run of the same kind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  source:
    name: source tree, dev group
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install this package and its dev group
        run: |
          uv venv --python 3.12
          uv pip install -e . --group dev

      # What actually ran, printed. A numerical suite that pins roundoff is a
      # suite whose answers depend on these builds, and when a cell moves the
      # first question is "against which BLAS" -- so the log answers it every
      # run rather than only when someone thinks to ask.
      #
      # THE CPU IS PART OF THAT ANSWER, and it took a measurement to learn it.
      # On 2026-09-02 a local linux/amd64 container resolved the same numpy
      # 2.5.2, scipy 1.18.1, jax 0.11.1 and scipy-openblas 0.3.34.0.0 as this
      # runner, and still disagreed with it on two cells: a Decimal oracle over
      # a `left @ left.T` product at condition 3.6e15, and a Vandermonde MAP
      # residual computed through JAX. OpenBLAS selects kernels at RUNTIME from
      # the host's instruction set and XLA generates code the same way, so the
      # container -- QEMU TCG, avx2 only -- rounds those two differently while
      # every library version matches. With the versions identical the CPU was
      # the only remaining variable, and nothing in the log said what it was.
      #
      # AND THE POOL IS HETEROGENEOUS, which the log then showed: three runs
      # served an AMD EPYC 7763 (no AVX-512), an AMD EPYC 9V74 and an Intel
      # Xeon Platinum 8370C. Two jobs of one workflow landed on the last two
      # while a third run put the same job on the first, so "the runner" is not
      # a machine and a fixture tuned to one is a fixture that will flap.
      - name: Say what the numerical stack is
        run: |
          .venv/bin/python - <<'PY'
          import platform, numpy, scipy, jax
          from importlib.metadata import PackageNotFoundError, version
          print("platform :", platform.platform(), platform.machine())
          print("numpy    :", numpy.__version__)
          print("scipy    :", scipy.__version__)
          print("jax      :", jax.__version__)
          # arviz and arviz-stats are named here because their ABSENCE from
          # this step cost a two-run log diff: on 2026-09-06 a byte-identical
          # commit went red overnight when arviz-stats moved 1.3.1 -> 1.3.2 and
          # changed a pinned `se`, and neither log said so. A moved dependency
          # should be a line here. Both are pinned in pyproject now, so this
          # step is what shows the pin actually took.
          for name in ("arviz", "arviz-stats"):
              try:
                  print(f"{name:9}:", version(name))
              except PackageNotFoundError:
                  print(f"{name:9}: absent")
          try:
              deps = numpy.__config__.CONFIG["Build Dependencies"]
              print("numpy blas:", deps["blas"]["name"], deps["blas"].get("version"))
              print("numpy lapack:", deps["lapack"]["name"], deps["lapack"].get("version"))
          except Exception as exc:
              print("numpy blas: unavailable --", exc)
          PY
          echo "cpu      : $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          echo "simd     : $(grep -m1 ^flags /proc/cpuinfo | tr ' ' '\n' \
            | grep -E '^(avx|avx2|avx512[a-z]*|fma|sse4_2)$' | sort -u | tr '\n' ' ')"
          echo "openblas : ${OPENBLAS_CORETYPE:-runtime-dispatched}"
          echo "cores    : $(nproc)"
          echo "memory   : $(awk '/MemTotal/ {printf "%.1f GiB total", $2/1048576} \
            /MemAvailable/ {printf ", %.1f GiB available", $2/1048576}' /proc/meminfo)"

      - name: Run the suite
        timeout-minutes: 120
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            layer='-m'; expr='not full'
          else
            layer=''; expr=''
          fi
          set +e
          # shellcheck disable=SC2086
          .venv/bin/python -m pytest -n 2 --dist loadgroup -p no:cacheprovider \
            ${layer:+"$layer"} ${expr:+"$expr"} --junit-xml=suite.xml
          echo "PYTEST_EXIT=$?" | tee suite.exit

      - name: Report the counts, and refuse a run that collected nothing
        if: always()
        run: |
          .venv/bin/python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          path = pathlib.Path("suite.xml")
          if not path.exists():
              sys.exit("no JUnit XML: pytest did not get far enough to write one")
          root = ET.parse(path).getroot()
          suite = root[0] if root.tag == "testsuites" else root
          a = suite.attrib
          tests = int(a["tests"]); skipped = int(a["skipped"])
          failures = int(a["failures"]); errors = int(a["errors"])
          passed = tests - skipped - failures - errors
          print(f"collected={tests} passed={passed} skipped={skipped} "
                f"failed={failures} errors={errors}")
          # A suite that stood itself down exits 0 and looks identical to one
          # that passed. The floor is the half
          # that tells them apart. 2500 is under the fast layer's own count,
          # which was 2826 at R3 and 3249 at R4 -- the floor is deliberately
          # well below either, because it exists to catch a collection that
          # collapsed, not to track the suite's size.
          if passed < 2500:
              sys.exit(f"only {passed} tests passed; this run compared almost "
                       "nothing and must not read as green")
          PY
          exit_code=$(cut -d= -f2 suite.exit)
          echo "pytest exit was ${exit_code}"
          # Only 1 is a test failure. 2 interrupted, 3 internal, 4 usage,
          # 5 nothing collected, 143 killed -- all of them are still red here,
          # but the log says which, because scoring any non-zero as "a test
          # failed" is how a usage error gets debugged as a numerical one.
          [ "$exit_code" = "0" ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-source-junit
          path: suite.xml

  wheel:
    name: built wheel, no dev extras
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Identical to publish.yml's build and test steps, deliberately. If these
      # two ever disagree, this job has stopped being the rehearsal it exists
      # to be -- so keep them in step, and prefer changing both in one commit.
      - name: Build the distributions
        run: |
          uv venv --python 3.12
          uv pip install build
          uv run python -m build

      # The wheel job gets this too, and it took a measurement to learn why.
      # On 2026-09-03 one run had the source job fail a boundary cell that the
      # wheel job passed -- same commit, same OpenBLAS, bit-identical numpy
      # inputs. GitHub allocates a FRESH VM PER JOB and the ubuntu-latest pool
      # is heterogeneous, so the two jobs need not share a CPU; OpenBLAS
      # dispatches its LAPACK kernels on that CPU. Only the source job logged
      # one, so the difference could be argued and not checked.
      - name: Say what the numerical stack is
        run: |
          echo "cpu      : $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          echo "simd     : $(grep -m1 ^flags /proc/cpuinfo | tr ' ' '\n' \
            | grep -E '^(avx|avx2|avx512[a-z]*|fma|sse4_2)$' | sort -u | tr '\n' ' ')"
          echo "cores    : $(nproc)"
          echo "memory   : $(awk '/MemTotal/ {printf "%.1f GiB total", $2/1048576} \
            /MemAvailable/ {printf ", %.1f GiB available", $2/1048576}' /proc/meminfo)"

      - name: Test the built wheel
        timeout-minutes: 120
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          uv venv --python 3.12 .testenv
          uv pip install --python .testenv/bin/python dist/*.whl \
            pytest pytest-xdist hypothesis
          if [ "$EVENT_NAME" = "pull_request" ]; then
            layer='-m'; expr='not full'
          else
            layer=''; expr=''
          fi
          set +e
          # shellcheck disable=SC2086
          .testenv/bin/python -m pytest -n 2 --dist loadgroup -p no:cacheprovider \
            ${layer:+"$layer"} ${expr:+"$expr"} --junit-xml=wheel.xml
          echo "PYTEST_EXIT=$?" | tee wheel.exit

      - name: Report the counts, and refuse a run that collected nothing
        if: always()
        run: |
          .testenv/bin/python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          path = pathlib.Path("wheel.xml")
          if not path.exists():
              sys.exit("no JUnit XML: pytest did not get far enough to write one")
          root = ET.parse(path).getroot()
          suite = root[0] if root.tag == "testsuites" else root
          a = suite.attrib
          tests = int(a["tests"]); skipped = int(a["skipped"])
          failures = int(a["failures"]); errors = int(a["errors"])
          passed = tests - skipped - failures - errors
          print(f"collected={tests} passed={passed} skipped={skipped} "
                f"failed={failures} errors={errors}")
          # Lower floor than the source job: this venv has no rheplicant and no
          # arviz, so roughly 111 tests skip by design.
          if passed < 2400:
              sys.exit(f"only {passed} tests passed; this run compared almost "
                       "nothing and must not read as green")
          PY
          exit_code=$(cut -d= -f2 wheel.exit)
          echo "pytest exit was ${exit_code}"
          [ "$exit_code" = "0" ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-wheel-junit
          path: wheel.xml
